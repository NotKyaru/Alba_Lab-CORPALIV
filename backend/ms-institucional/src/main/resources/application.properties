spring.application.name=ms-institucional
server.port=8082

# H2 en archivo: los datos quedan en ms-institucional/data/ y sobreviven a un reinicio.
spring.datasource.url=jdbc:h2:file:./data/institucional
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola web para editar datos en vivo: http://localhost:8082/h2-console (solo desde este PC).
spring.h2.console.enabled=true
